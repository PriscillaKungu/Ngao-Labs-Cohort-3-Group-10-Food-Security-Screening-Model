<!DOCTYPE html>
<html>
<head><title>Household Food Security Screening</title></head>
<body>
  <h2>Screen a household</h2>
  <p>For bulk screening (recommended for caseworkers), POST a CSV to
     <code>/predict-batch</code> instead — see the manual.</p>
  <form id="f">
    <label>Household size: <input name="hhsize" type="number"></label><br>
    <label>Head age: <input name="head_age" type="number"></label><br>
    <!-- add one input per field the model needs; see training_feature_columns
         in the notebook for the full list -->
    <button type="submit">Screen household</button>
  </form>
  <pre id="out"></pre>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/predict', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
